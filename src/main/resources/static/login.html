<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart-Pharma Engine · Sign In</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Space Grotesk (display/technical) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Space Grotesk"', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                    colors: {
                        emerald: {
                            450: '#12b981',
                        }
                    },
                    boxShadow: {
                        'glow-emerald': '0 0 0 1px rgba(16,185,129,0.15), 0 0 40px -8px rgba(16,185,129,0.35)',
                    },
                    keyframes: {
                        pulseline: {
                            '0%': { strokeDashoffset: '400' },
                            '100%': { strokeDashoffset: '0' },
                        },
                        floatUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    },
                    animation: {
                        pulseline: 'pulseline 2.6s linear infinite',
                        floatUp: 'floatUp 0.6s ease-out both',
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }

        /* Molecular lattice backdrop */
        .lattice-bg {
            background-image:
                    radial-gradient(circle at 1px 1px, rgba(16,185,129,0.14) 1px, transparent 0);
            background-size: 28px 28px;
        }

        /* Floating label mechanics */
        .fl-input:focus ~ .fl-label,
        .fl-input:not(:placeholder-shown) ~ .fl-label {
            transform: translateY(-1.55rem) scale(0.78);
            color: #34d399;
        }
        .fl-label {
            transform-origin: left top;
            transition: transform 150ms ease, color 150ms ease;
        }

        /* Custom toggle */
        .toggle-dot { transition: transform 180ms ease; }
        .toggle-input:checked ~ .toggle-track { background-color: #10b981; }
        .toggle-input:checked ~ .toggle-track .toggle-dot { transform: translateX(1.15rem); }

        /* Scrollbar-less Google button shell blending into dark card */
        .g-shell { color-scheme: dark; }

        ::selection { background: rgba(16,185,129,0.35); }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center px-4 py-10 lattice-bg">

<!-- Ambient glow -->
<div class="pointer-events-none fixed -top-40 left-1/2 -translate-x-1/2 w-[42rem] h-[42rem] bg-emerald-500/10 blur-[120px] rounded-full"></div>

<main class="relative w-full max-w-md animate-floatUp">

    <!-- Card -->
    <div class="bg-slate-800/90 backdrop-blur border border-slate-700/80 rounded-2xl shadow-glow-emerald overflow-hidden">

        <!-- Header -->
        <div class="px-8 pt-9 pb-6 border-b border-slate-700/70 relative">
            <div class="flex items-start justify-between">
                <div class="flex items-center gap-3">
                    <!-- Logo mark: RX pulse -->
                    <div class="w-11 h-11 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center shrink-0">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 4h4.5a3.5 3.5 0 0 1 0 7H8v9M8 11l5 9" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="font-display font-semibold text-lg leading-tight text-slate-50 tracking-tight">
                            Jayalath <span class="text-emerald-400">Smart-Pharma</span>
                        </h1>
                        <p class="text-xs text-slate-400 mt-0.5 font-body">Clinical Intelligence Console</p>
                    </div>
                </div>
                <span class="shrink-0 mt-1 text-[10px] font-mono font-medium tracking-wider text-emerald-300 bg-emerald-500/10 border border-emerald-500/30 rounded-full px-2 py-1">
            v2.0
          </span>
            </div>

            <!-- Pulse divider signature -->
            <svg class="mt-5 w-full h-6" viewBox="0 0 400 24" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 12 H150 L162 12 L170 2 L180 22 L188 12 L400 12"
                      stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                      stroke-dasharray="400" class="animate-pulseline opacity-70"/>
            </svg>
        </div>

        <!-- Form -->
        <div class="px-8 py-7">
            <p class="text-sm text-slate-400 mb-6 font-body">
                Sign in to access dosage models, formulary data, and patient-safety analytics.
            </p>

            <form id="loginForm" class="space-y-6" novalidate>

                <!-- Email -->
                <div class="relative pt-3">
                    <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder=" "
                            required
                            class="fl-input peer w-full bg-slate-900/60 border border-slate-600 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/40 rounded-lg px-3.5 pt-4 pb-2 text-sm text-slate-100 outline-none transition-colors"
                    />
                    <label for="email" class="fl-label absolute left-3.5 top-[1.15rem] text-sm text-slate-400 pointer-events-none">
                        Work email
                    </label>
                </div>

                <!-- Password -->
                <div class="relative pt-3">
                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder=" "
                            required
                            minlength="6"
                            class="fl-input peer w-full bg-slate-900/60 border border-slate-600 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/40 rounded-lg px-3.5 pt-4 pb-2 pr-10 text-sm text-slate-100 outline-none transition-colors"
                    />
                    <label for="password" class="fl-label absolute left-3.5 top-[1.15rem] text-sm text-slate-400 pointer-events-none">
                        Password
                    </label>
                    <button type="button" id="togglePw" tabindex="-1"
                            class="absolute right-3 top-[1.05rem] text-slate-500 hover:text-emerald-400 transition-colors">
                        <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.6"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
                        </svg>
                        <svg id="eyeClosed" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.7 6.7C3.9 8.4 2 12 2 12s4 7 11 7c1.9 0 3.6-.5 5-1.2M17.5 17.5C19.9 15.9 22 12 22 12s-1.6-2.8-4.3-4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>

                <!-- Remember + forgot -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2.5 cursor-pointer select-none group">
              <span class="relative inline-flex items-center">
                <input type="checkbox" id="rememberMe" class="toggle-input sr-only peer">
                <span class="toggle-track w-9 h-5 bg-slate-600 rounded-full transition-colors relative">
                  <span class="toggle-dot absolute top-0.5 left-0.5 w-4 h-4 bg-slate-100 rounded-full shadow"></span>
                </span>
              </span>
                        <span class="text-slate-400 group-hover:text-slate-300 transition-colors">Remember me</span>
                    </label>
                    <a href="#" class="text-emerald-400 hover:text-emerald-300 font-medium transition-colors">Forgot password?</a>
                </div>

                <!-- Inline error -->
                <p id="formError" class="hidden text-sm text-red-400 bg-red-500/10 border border-red-500/30 rounded-lg px-3 py-2"></p>

                <!-- Submit -->
                <button
                        type="submit"
                        id="submitBtn"
                        class="w-full bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-900 font-semibold text-sm rounded-lg py-2.5 transition-colors flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 disabled:opacity-60 disabled:cursor-not-allowed"
                >
                    <span id="submitLabel">Sign In</span>
                    <svg id="submitSpinner" class="hidden animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-3 my-6">
                <span class="h-px flex-1 bg-slate-700"></span>
                <span class="text-xs text-slate-500 font-mono">OR CONTINUE WITH</span>
                <span class="h-px flex-1 bg-slate-700"></span>
            </div>

            <!-- Google OAuth2 -->
            <div class="g-shell">
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                     data-callback="handleGoogleLogin"
                     data-auto_prompt="false">
                </div>
                <div class="flex justify-center">
                    <div class="g_id_signin"
                         data-type="standard"
                         data-shape="pill"
                         data-theme="filled_black"
                         data-text="signin_with"
                         data-size="large"
                         data-logo_alignment="left"
                         data-width="304">
                    </div>
                </div>
            </div>

            <p class="text-center text-xs text-slate-500 mt-7 font-body">
                Access restricted to authorized clinical &amp; pharmacy staff.
            </p>
        </div>
    </div>

    <p class="text-center text-xs text-slate-600 mt-6 font-mono">
        SMART-PHARMA ENGINE · SECURE AUTH GATEWAY
    </p>
</main>

<script>
    const API_BASE = 'http://localhost:8080/api/v1/auth';

    const form          = document.getElementById('loginForm');
    const emailInput    = document.getElementById('email');
    const pwInput       = document.getElementById('password');
    const rememberBox   = document.getElementById('rememberMe');
    const submitBtn     = document.getElementById('submitBtn');
    const submitLabel   = document.getElementById('submitLabel');
    const submitSpinner = document.getElementById('submitSpinner');
    const formError     = document.getElementById('formError');
    const togglePwBtn   = document.getElementById('togglePw');
    const eyeOpen       = document.getElementById('eyeOpen');
    const eyeClosed     = document.getElementById('eyeClosed');

    // Password visibility toggle
    togglePwBtn.addEventListener('click', () => {
        const isPw = pwInput.type === 'password';
        pwInput.type = isPw ? 'text' : 'password';
        eyeOpen.classList.toggle('hidden', isPw);
        eyeClosed.classList.toggle('hidden', !isPw);
    });

    function showError(message) {
        formError.textContent = message;
        formError.classList.remove('hidden');
    }

    function clearError() {
        formError.classList.add('hidden');
        formError.textContent = '';
    }

    function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        submitLabel.textContent = isLoading ? 'Signing in…' : 'Sign In';
        submitSpinner.classList.toggle('hidden', !isLoading);
    }

    // Save Token & User Details to localStorage
    function persistSession(authData, remember) {
        localStorage.setItem('jwtToken', authData.token);
        localStorage.setItem('userEmail', authData.username);
        localStorage.setItem('userRole', authData.role);
        localStorage.setItem('userFullName', authData.fullName);
        localStorage.setItem('rememberMe', remember ? 'true' : 'false');
    }

    // Standard login
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        if (!form.checkValidity()) {
            showError('Please enter a valid work email and a password of at least 6 characters.');
            return;
        }

        setLoading(true);

        try {
            const res = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: emailInput.value.trim(), // Backend expects 'username' key
                    password: pwInput.value
                }),
            });

            const jsonResponse = await res.json().catch(() => ({}));

            if (!res.ok || jsonResponse.code !== 200) {
                throw new Error(jsonResponse.message || 'Invalid credentials. Please try again.');
            }

            const authData = jsonResponse.data; // AuthResponseDTO extracted from CommonResponse

            if (!authData || !authData.token) {
                throw new Error('Login succeeded but no token was returned by the server.');
            }

            persistSession(authData, rememberBox.checked);
            window.location.href = 'dashboard.html';

        } catch (err) {
            showError(err.message || 'Unable to sign in right now. Please try again.');
        } finally {
            setLoading(false);
        }
    });

    // Google Identity Services callback
    async function handleGoogleLogin(response) {
        clearError();
        setLoading(true);

        try {
            const res = await fetch(`${API_BASE}/google`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    idToken: response.credential // Backend expects 'idToken' key
                }),
            });

            const jsonResponse = await res.json().catch(() => ({}));

            if (!res.ok || jsonResponse.code !== 200) {
                throw new Error(jsonResponse.message || 'Google sign-in failed. Please try again.');
            }

            const authData = jsonResponse.data; // AuthResponseDTO extracted from CommonResponse

            if (!authData || !authData.token) {
                throw new Error('Google sign-in succeeded but no token was returned by the server.');
            }

            persistSession(authData, true);
            window.location.href = 'dashboard.html';

        } catch (err) {
            showError(err.message || 'Unable to sign in with Google right now.');
        } finally {
            setLoading(false);
        }
    }

    window.handleGoogleLogin = handleGoogleLogin;
</script>
</body>
</html>
